name: Update Moraira calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 3"  # woensdag 08:15 Europe/Madrid in zomertijd; GitHub gebruikt UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 icalendar python-dateutil

      - name: Update calendar
        run: python scripts/update_calendar.py

      - name: Commit changes
        run: |
          git config user.name "moraira-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add moraira.ics
          if git diff --cached --quiet; then
            echo "No calendar changes."
          else
            git commit -m "Update Moraira calendar"
            git push
          fi